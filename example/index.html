<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>nostr-zap examples</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        max-width: 640px;
        margin: 24px auto;
        padding: 0 16px;
        color: #1a202c;
      }

      .note {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }

      .note-author {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .note-author img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
      }

      .note-author strong {
        display: block;
      }

      .note-author span {
        color: #718096;
        font-size: 0.875em;
      }

      .note-content {
        white-space: pre-wrap;
        line-height: 1.5;
        margin: 0 0 8px 0;
      }

      .note-meta {
        color: #718096;
        font-size: 0.875em;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Zap Npub Example</h1>
    <button
      data-npub="npub1vp8fdcyejd4pqjyrjk9sgz68vuhq7pyvnzk8j0ehlljvwgp8n6eqsrnpsw"
      data-relays="wss://relay.damus.io,wss://nostr.wine,wss://relay.ditto.pub"
    >
      Zap NotBiebs ⚡️
    </button>

    <h1>Zap Note Example</h1>
    <article class="note">
      <div class="note-author">
        <img
          src="https://image.nostr.build/dff76e2e6688ccdd0d11a9323327210e16f0bf4a204903f7d38d32ab797a8ae7.jpg"
          alt="35hara avatar"
          width="48"
          height="48"
        />
        <div>
          <strong>35hara</strong>
          <span>npub1jcjx…vmtwx</span>
        </div>
      </div>
      <p class="note-content">
        You are both criminal. Too much penis butter feels weird in my mouth.
        Jelly for the win 🥹🫠
      </p>
      <p class="note-meta">
        <time datetime="2023-09-13T17:16:51.000Z">Sep 13, 2023</time>
      </p>
    </article>
    <button
      data-npub="npub1jcjxjg92200kdp8guw8sysg8gr0ez29hahrfdy49h30hgnkpa4kqfvmtwx"
      data-note-id="note1tlcak82u75nuw6lqw0xdmh8dy2qmga6s53nplz6gx7jv204uhv4qgkl0lj"
      data-relays="wss://relay.damus.io,wss://nostr.wine,wss://relay.ditto.pub"
    >
      Zap This Note ⚡️
    </button>

    <script src="../dist/main.js"></script>
  </body>
</html>
